name: Axiological Studio tests
on:
  push:
    branches:
      - experiment/sentiment-contrast-eniac2026
    paths:
      - studio/**
      - .github/workflows/axiological-studio-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r studio/requirements-studio.txt
      - name: Test real gold, 50 percent holdout and bundle
        run: python studio/evaluate_and_test.py
      - name: Audit group-disjoint original applicability on 50 percent heldout
        run: python studio/audit_applicability.py
      - name: Compile all Studio modules
        run: python -m compileall -q studio
      - name: Test API with included, excluded and empty inputs
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'studio')
          from fastapi.testclient import TestClient
          from api import app
          client = TestClient(app)
          response = client.post('/analyze', json={'texts': [
              'Precisamos estudar inteligência artificial e educação.',
              'Hoje choveu muito.',
              ''
          ]})
          print('HTTP', response.status_code)
          print(response.text[:1200])
          assert response.status_code == 200
          data = response.json()
          assert len(data['predictions']) == 3
          assert data['predictions'][2]['applicability'] is None
          assert data['predictions'][2]['acceptance_3'] is None
          assert data['predictions'][1]['review_recommended'] is True
          assert data['predictions'][1]['cue_ai'] is False
          assert data['predictions'][1]['cue_education'] is False
          assert data['predictions'][1]['applicability'] in [0,1]
          # A warning never silently overrides the model's prediction.
          assert client.post('/analyze-extended', json={'texts':['test']}).status_code == 503
          assert client.get('/health').status_code == 200
          PY
      - name: Smoke test Streamlit interface
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'studio')
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('studio/app.py').run(timeout=120)
          assert not at.exception, [str(x.message) for x in at.exception]
          assert at.title[0].value == 'Axiological Studio'
          at.text_area[0].input('É urgente ensinar como usar inteligência artificial criticamente.').run(timeout=120)
          at.button(key='single_analyze').click().run(timeout=120)
          assert not at.exception, [str(x.message) for x in at.exception]
          print('STREAMLIT_SINGLE_TEXT_INFERENCE_PASS')
          PY
      - name: Upload trained model files and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: axiological-studio-models
          path: |
            studio/model_bundle/**
            studio/metrics_50pct.json
            studio/gate_audit_50pct.json
          retention-days: 30
