name: Axiological Studio tests
on:
  push:
    branches:
      - experiment/sentiment-contrast-eniac2026
    paths:
      - studio/**
      - .github/workflows/axiological-studio-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r studio/requirements-studio.txt
      - name: Test real gold, 50 percent holdout and bundle
        run: python studio/evaluate_and_test.py
      - name: Test API with included, excluded and empty inputs
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'studio')
          from fastapi.testclient import TestClient
          from api import app
          client = TestClient(app)
          response = client.post('/analyze', json={'texts': [
              'Precisamos estudar inteligência artificial e educação.',
              'Hoje choveu muito.',
              ''
          ]})
          print('HTTP', response.status_code)
          print(response.text[:1200])
          assert response.status_code == 200
          data = response.json()
          assert len(data['predictions']) == 3
          assert data['predictions'][2]['applicability'] is None
          assert data['predictions'][2]['acceptance_3'] is None
          assert client.get('/health').status_code == 200
          PY
      - name: Upload trained model files and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: axiological-studio-models
          path: |
            studio/model_bundle/**
            studio/metrics_50pct.json
          retention-days: 30
