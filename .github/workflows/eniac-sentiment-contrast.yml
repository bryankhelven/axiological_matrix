name: ENIAC sentiment contrast
on:
  push:
    branches:
      - experiment/sentiment-contrast-eniac2026
    paths:
      - .github/workflows/eniac-sentiment-contrast.yml
      - experiments/sentiment/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install experiment requirements
        run: python -m pip install -r experiments/sentiment/requirements.txt
      - name: Validate frozen gold
        run: python experiments/sentiment/run_contrast.py --check-input
      - name: Run supplementary analysis
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/sentiment/run_contrast.py
      - name: Upload unreviewed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eniac-sentiment-contrast-unreviewed
          path: experiments/sentiment/output/
          if-no-files-found: warn
          retention-days: 30
